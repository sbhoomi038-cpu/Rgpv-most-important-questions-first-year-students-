<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RGPV Important Questions</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #173b75;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        header p {
            margin: 0;
        }

        main {
            max-width: 850px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        .btn {
            display: block;
            width: 100%;
            background: #173b75;
            color: white;
            text-decoration: none;
            border: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
        }

        .btn:hover {
            background: #285aa0;
        }

        .back {
            background: #667085;
        }

        .question {
            border-left: 5px solid #173b75;
        }

        .answer {
            background: #eef3ff;
            padding: 15px;
            margin-top: 10px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Most Repeated & Important Questions</h1>
    <p>RGPV University • 1st & 2nd Semester</p>
</header>

<main>

    <!-- HOME -->
    <section id="home" class="card">
        <h2>📚 Study Smart</h2>

        <p>
            Most Repeated & Important Questions for
            RGPV First Year Engineering Students.
        </p>

        <button class="btn" onclick="showPage('sets')">
            👉 Start Preparation
        </button>
    </section>


    <!-- SET PAGE -->
    <section id="sets" class="card hidden">

        <button class="btn back" onclick="showPage('home')">
            ← Back
        </button>

        <h2>📖 Select Semester Set</h2>

        <button class="btn" onclick="showPage('setA')">
            SET A — 1st Semester
        </button>

        <button class="btn" onclick="showPage('setB')">
            SET B — 2nd Semester
        </button>

    </section>


    <!-- SET A -->
    <section id="setA" class="card hidden">

        <button class="btn back" onclick="showPage('sets')">
            ← Back
        </button>

        <h2>SET A — 1st Semester</h2>

        <div id="setAList"></div>

    </section>


    <!-- SET B -->
    <section id="setB" class="card hidden">

        <button class="btn back" onclick="showPage('sets')">
            ← Back
        </button>

        <h2>SET B — 2nd Semester</h2>

        <div id="setBList"></div>

    </section>


    <!-- QUESTIONS -->
    <section id="questions" class="card hidden">

        <button class="btn back" onclick="goBackToSet()">
            ← Back
        </button>

        <h2 id="subjectTitle"></h2>

        <div id="questionList"></div>

    </section>

</main>

/* =========================
   SHOW PAGE
========================= */

function showPage(pageId) {

    const pages = [
        "home",
        "sets",
        "setA",
        "setB",
        "questions"
    ];

    pages.forEach(function(page) {
        document.getElementById(page).classList.add("hidden");
    });

    document.getElementById(pageId).classList.remove("hidden");
}


/* =========================
   CREATE SUBJECT BUTTONS
========================= */

function createSubjects(setName, elementId) {

    const box = document.getElementById(elementId);

    subjects[setName].forEach(function(subject) {

        const button = document.createElement("button");

        button.className = "btn";

        button.textContent = "📘 " + subject;

        button.onclick = function() {
            openSubject(subject, setName);
        };

        box.appendChild(button);

    });
}


/* =========================
   OPEN SUBJECT
========================= */

let currentSet = "sets";

function openSubject(subject, setName) {

    currentSet = setName;

    document.getElementById("subjectTitle").textContent = subject;

    const questionBox = document.getElementById("questionList");

    questionBox.innerHTML = "";

    questions[subject].forEach(function(question, index) {

        const card = document.createElement("div");

        card.className = "card question";

        card.innerHTML = `

            <h3>
                Q${index + 1}. ${question}
            </h3>

            <button class="btn"
                onclick="toggleAnswer(this)">
                👁 Show Answer
            </button>

            <div class="answer hidden">

                <b>Answer:</b>

                <p>
                    This question will contain the complete
                    RGPV exam-oriented answer in easy English.
                </p>

                <p>
                    <b>Preparation:</b>
                    Definition + Main Points + Explanation +
                    Diagram/Formula/Example wherever required.
                </p>

            </div>

        `;

        questionBox.appendChild(card);

    });

    showPage("questions");
}


/* =========================
   SHOW / HIDE ANSWER
========================= */

function toggleAnswer(button) {

    const answer = button.nextElementSibling;

    answer.classList.toggle("hidden");

    if (answer.classList.contains("hidden")) {

        button.textContent = "👁 Show Answer";

    } else {

        button.textContent = "🙈 Hide Answer";

    }

}


/* =========================
   BACK BUTTON
========================= */

function goBackToSet() {

    if (currentSet === "A") {

        showPage("setA");

    } else {

        showPage("setB");

    }

}


/* =========================
   START WEBSITE
========================= */

createSubjects("A", "setAList");

createSubjects("B", "setBList");

</script>

</body>
  </html>
